name: Tests

on:
  pull_request:
    branches:
    - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: OTP 29.0.3 / Elixir 1.20.2
    env:
      MIX_ENV: test
      CI: "true"
    steps:
    - uses: actions/checkout@v3
    - uses: erlef/setup-beam@v1
      with:
        otp-version: '29.0.3'
        elixir-version: '1.20.2'
    - run: mix deps.get
    - run: mix compile --force --warnings-as-errors
    - run: mix test
